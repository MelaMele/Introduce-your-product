<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የ1-ደቂቃ ዲጂታል ሱቅ</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; padding: 15px; color: #333; }
        .card { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { margin-bottom: 12px; color: #1a1a1a; font-size: 18px; }
        label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: bold; color: #555; }
        input, button { width: 100%; padding: 12px; margin: 4px 0 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; outline: none; }
        input:focus { border-color: #0088cc; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { opacity: 0.8; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .share-box { background: #eef7ff; border: 1px dashed #0088cc; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; }
        .share-box p { font-size: 13px; color: #333; word-break: break-all; font-weight: bold; margin-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .product-card { background: #fff; border-radius: 10px; border: 1px solid #eee; overflow: hidden; text-align: center; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; background: #f0f0f0; }
        .product-card h4 { font-size: 14px; margin: 8px 0 4px; color: #222; }
        .price { font-weight: bold; color: #28a745; margin-bottom: 8px; font-size: 15px; }
        .buy-btn { background: #28a745; padding: 8px; font-size: 13px; margin: 0; }
        .hidden { display: none; }
        .status-msg { font-size: 13px; color: #666; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- 1. የሱቅ መመዝገቢያ/መግቢያ (ለነጋዴው) -->
    <div class="card" id="login-section">
        <h2>📱 በስልክ ቁጥርዎ ይግቡ / ሱቅ ይክፈቱ</h2>
        <label for="sellerPhone">የስልክ ቁጥር</label>
        <input type="tel" id="sellerPhone" placeholder="ምሳሌ፡ 0913064239">
        
        <label for="storeName">የሱቅዎ ስም</label>
        <input type="text" id="storeName" placeholder="ምሳሌ፡ Mela Fashion">
        
        <button onclick="loginOrRegisterStore()">ሱቅ ክፈት / ግባ 🚀</button>
    </div>

    <!-- 2. የነጋዴው ማስገቢያ ፎርም (ለነጋዴው) -->
    <div class="card hidden" id="seller-section">
        <h2 id="welcomeMsg">🛍️ አዲስ ምርት ጨምር</h2>
        
        <label for="prodName">የምርቱ ስም</label>
        <input type="text" id="prodName" placeholder="ምሳሌ፡ የወንዶች ጂንስ">
        
        <label for="prodPrice">ዋጋ (በብር)</label>
        <input type="number" id="prodPrice" placeholder="ምሳሌ፡ 2500">
        
        <label for="prodImageFile">የምርቱ ፎቶ (ከካሜራ ወይም ከጋለሪ)</label>
        <input type="file" id="prodImageFile" accept="image/*" capture="environment">
        
        <button id="saveBtn" onclick="addProduct()">ምርቱን መዝግብ 📸</button>
        <div id="loadingStatus" class="status-msg"></div>

        <!-- የሱቅ ሊንክ ማጋሪያ Box -->
        <div class="share-box">
            <span style="font-size: 12px; color: #555;">የእርስዎ የሱቅ ሊንክ (ለደንበኞች የሚያጋሩት)፡</span>
            <p id="storeShareUrl">...</p>
            <button onclick="copyStoreLink()" style="background: #17a2b8; margin: 0; padding: 8px; font-size: 12px;">ሊንኩን ኮፒ አድርግ 📋</button>
        </div>
    </div>

    <!-- 3. ለደንበኛው የሚታየው ሱቅ -->
    <div class="card">
        <h3 id="storeTitle">የእኔ ዲጂታል ካታሎግ</h3>
        <div class="grid" id="productGrid">
            <p style="grid-column: 1/-1; text-align: center; color: #888;">ምንም የተጫነ ምርት የለም።</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwyn_rW-yLyok0tVkk9xizJP8hgYWO7rIeKImgG5yWu5Druv04UIBTb1sioMZxzEoe/exec"; 
        let currentPhone = "";

        // የስልክ ቁጥር ማጽጃ
        function cleanPhone(p) {
            if(!p) return "";
            let str = String(p).replace(/\D/g, '');
            return str.slice(-9); // የመጨረሻዎቹን 9 ቁጥሮች ብቻ መውሰድ
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const phoneParam = urlParams.get('phone');

            if (phoneParam) {
                const cleanedPhone = cleanPhone(phoneParam);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('seller-section').classList.add('hidden');
                document.getElementById('storeTitle').innerText = `🛒 የሱቅ ካታሎግ`;
                loadStoreProducts(cleanedPhone);
            }
        };

        async function loginOrRegisterStore() {
            const rawPhone = document.getElementById('sellerPhone').value.trim();
            const store = document.getElementById('storeName').value.trim();

            if (!rawPhone) {
                alert('እባክዎን የስልክ ቁጥር ያስገቡ!');
                return;
            }

            currentPhone = cleanPhone(rawPhone);
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('seller-section').classList.remove('hidden');
            document.getElementById('welcomeMsg').innerText = `🛍️ ${store || 'የእኔ ሱቅ'} - አዲስ ምርት ጨምር`;
            document.getElementById('storeTitle').innerText = `🛍️ ${store || 'የእኔ ሱቅ'} - የዕቃዎች ዝርዝር`;

            const shareUrl = `${window.location.origin}${window.location.pathname}?phone=${currentPhone}`;
            document.getElementById('storeShareUrl').innerText = shareUrl;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'register_store', phone: currentPhone, store_name: store })
            });

            loadStoreProducts(currentPhone);
        }

        function copyStoreLink() {
            const shareUrl = document.getElementById('storeShareUrl').innerText;
            navigator.clipboard.writeText(shareUrl);
            alert('የሱቅዎ ሊንክ ኮፒ ተደርጓል! ለደንበኞችዎ ማጋራት ይችላሉ።');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const fileInput = document.getElementById('prodImageFile');
            const saveBtn = document.getElementById('saveBtn');
            const statusDiv = document.getElementById('loadingStatus');

            if (!name || !price || !fileInput.files[0]) {
                alert('እባክዎን ስም፣ ዋጋ እና ፎቶ ያስገቡ!');
                return;
            }

            saveBtn.innerText = "ፎቶው እየተዘጋጀ ነው... ⏳";
            saveBtn.disabled = true;
            statusDiv.innerText = "የፎቶውን መጠን በማነስ ላይ...";

            const file = fileInput.files[0];
            
            compressImage(file, 800, 0.7, async function(base64Image) {
                statusDiv.innerText = "ፎቶው ወደ Google Drive እየተላከ ነው...";
                
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'add_product',
                            seller_phone: currentPhone,
                            name: name,
                            price: price,
                            image_data: base64Image
                        })
                    });

                    alert('ምርቱ ከነፎቶው በተሳካ ሁኔታ ተመዝግቧል!');
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodPrice').value = '';
                    document.getElementById('prodImageFile').value = '';
                    statusDiv.innerText = "";
                    
                    setTimeout(() => { loadStoreProducts(currentPhone); }, 2500);
                } catch(err) {
                    alert('ምርቱን ሲጭን ስህተት አጋጥሟል!');
                    statusDiv.innerText = "";
                } finally {
                    saveBtn.innerText = "ምርቱን መዝግብ 📸";
                    saveBtn.disabled = false;
                }
            });
        }

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    callback(compressedBase64);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function loadStoreProducts(phone) {
            const grid = document.getElementById('productGrid');
            try {
                const res = await fetch(`${SCRIPT_URL}?phone=${phone}`);
                const products = await res.json();
                renderProducts(products);
            } catch (err) {
                console.error("Error loading products:", err);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(!products || products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">ምንም የተጫነ ምርት የለም።</p>';
                return;
            }
            products.forEach((p) => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image_url}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
                        <h4>${p.name}</h4>
                        <div class="price">${p.price} ብር</div>
                        <button class="buy-btn" onclick="buyProduct('${p.name}', '${p.price}')">በቴሌብር ግዛ</button>
                    </div>
                `;
            });
        }

        function buyProduct(name, price) {
            alert(`የ'${name}' ትእዛዝ ተመዝግቧል። እባክዎን ${price} ብር በቴሌብር ይላኩ!`);
        }
    </script>
</body>
</html>
