<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የእኔ ዲጂታል ሱቅ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f4f9; color: #333; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #0088cc; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #006699; }
    .btn-edit { background-color: #f0ad4e; margin-top: 5px; }
    .btn-delete { background-color: #d9534f; margin-top: 5px; }
    .btn-map { background-color: #5cb85c; margin-top: 5px; text-decoration: none; display: inline-block; text-align: center; color: white; line-height: 20px; }
    .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. የሱቅ መመዝገቢያ/መግቢያ -->
  <div id="store-setup" class="card hidden">
    <h2>🏪 የሱቅ መረጃ</h2>
    <input type="text" id="store-name" placeholder="የሱቅ ስም">
    <input type="tel" id="seller-phone" placeholder="የስልክ ቁጥር (09...)">
    <button onclick="registerStore()">ሱቅ አስገባ / ግባ</button>
  </div>

  <!-- 2. የሱቅ አስተዳዳሪ ዳሽቦርድ (Seller Dashboard) -->
  <div id="seller-dashboard" class="card hidden">
    <h2 id="display-store-name"></h2>
    <p id="account-status"></p>

    <!-- የ GPS አድራሻ ማዘመኛ -->
    <details style="margin-bottom: 15px;">
      <summary><b>📍 የሱቅ GPS አድራሻ ማስተካከያ</b></summary>
      <input type="text" id="location-url" placeholder="የ Google Maps ሊንክ አስገባ">
      <button onclick="updateLocation()">አድራሻ መዝግብ</button>
    </details>

    <hr>
    <h3>➕ አዲስ ምርት ጨምር</h3>
    <input type="text" id="prod-name" placeholder="የምርት ስም">
    <input type="number" id="prod-price" placeholder="ዋጋ (በብር)">
    <input type="file" id="prod-image" accept="image/*">
    <button onclick="addProduct()">ምርት መዝግብ</button>
  </div>

  <!-- 3. የምርቶች ዝርዝር -->
  <h3>🛍️ ምርቶች</h3>
  <div id="products-list"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🔗 እዚህ ጋር የራስህን የ Google Apps Script Executable Web App URL ተካ!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7W5o37WhtIkTKKhL2kK2cRN4VQmT5e7700RaZ3KxsoFrnpYVkK8jpUyxgYG9v_yM/exec"; 

    let currentPhone = localStorage.getItem("seller_phone") || "";

    window.onload = function() {
      if (currentPhone) {
        loadData();
      } else {
        document.getElementById("store-setup").classList.remove("hidden");
      }
    };

    // ሱቅ መመዝገብ
    function registerStore() {
      const name = document.getElementById("store-name").value;
      const phone = document.getElementById("seller-phone").value;

      if (!name || !phone) return alert("እባክዎን ሁሉንም ያስገቡ!");

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "register_store",
          store_name: name,
          phone: phone,
          telegram_username: tg.initDataUnsafe?.user?.username || ""
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          localStorage.setItem("seller_phone", phone);
          currentPhone = phone;
          loadData();
        }
      });
    }

    // መረጃዎችን ከ Google Sheet መጫን
    function loadData() {
      document.getElementById("store-setup").classList.add("hidden");
      document.getElementById("seller-dashboard").classList.remove("hidden");

      fetch(`${SCRIPT_URL}?phone=${currentPhone}`)
      .then(res => res.json())
      .then(data => {
        if (data.store) {
          document.getElementById("display-store-name").innerText = "🏪 " + data.store.name;
          if (data.store.location) {
            document.getElementById("location-url").value = data.store.location;
          }
        }
        renderProducts(data.products, data.store.location);
      });
    }

    // ምርቶችን በስክሪን ላይ ማሳየት
    function renderProducts(products, locationUrl) {
      const listDiv = document.getElementById("products-list");
      listDiv.innerHTML = "";

      if (!products || products.length === 0) {
        listDiv.innerHTML = "<p>ምንም የተጫነ ምርት የለም።</p>";
        return;
      }

      products.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${p.image_url}" class="product-img">
          <h4>${p.name}</h4>
          <p><b>ዋጋ:</b> ${p.price} ብር</p>
          
          ${locationUrl ? `<a href="${locationUrl}" target="_blank" class="button btn-map">📍 ሱቁን በካርታ እይ</a>` : ''}
          
          <button class="btn-edit" onclick="editPrice('${p.id}', '${p.price}')">✏️ ዋጋ አስተካክል</button>
          <button class="btn-delete" onclick="deleteProduct('${p.id}')">🗑️ አጥፋ</button>
        `;
        listDiv.appendChild(card);
      });
    }

    // 1. የዋጋ ማስተካከያ (Edit Price)
    function editPrice(prodId, currentPrice) {
      const newPrice = prompt("አዲሱን ዋጋ ያስገቡ (በብር):", currentPrice);
      if (newPrice && newPrice !== currentPrice) {
        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "update_product",
            product_id: prodId,
            new_price: newPrice
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            alert("ዋጋው ተስተካክሏል!");
            loadData();
          }
        });
      }
    }

    // 2. የ GPS Location ማዘመኛ
    function updateLocation() {
      const locUrl = document.getElementById("location-url").value;
      if (!locUrl) return alert("እባክዎን የ Google Maps ሊንክ ያስገቡ!");

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "update_location",
          phone: currentPhone,
          location_url: locUrl
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("የሱቅ አድራሻ ተመዝግቧል!");
          loadData();
        }
      });
    }

    // 3. አዲስ ምርት መጨመር
    function addProduct() {
      const name = document.getElementById("prod-name").value;
      const price = document.getElementById("prod-price").value;
      const fileInput = document.getElementById("prod-image");

      if (!name || !price) return alert("ስምና ዋጋ ያስገቡ!");

      let imageData = "";
      if (fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imageData = e.target.result;
          sendProductReq(name, price, imageData);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        sendProductReq(name, price, "");
      }
    }

    function sendProductReq(name, price, imageData) {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "add_product",
          seller_phone: currentPhone,
          name: name,
          price: price,
          image_data: imageData
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("ምርቱ ተጨምሯል!");
          document.getElementById("prod-name").value = "";
          document.getElementById("prod-price").value = "";
          loadData();
        } else if (data.message === "EXPIRED_LIMIT") {
          alert("⚠️ የነፃ 10 ምርት ገደብ አልቋል። እባክዎን ወርሃዊ ክፍያ ይክፈሉ።");
        } else if (data.message === "EXPIRED_TIME") {
          alert("⚠️ የነፃ 7 ቀን አገልግሎት አልቋል። እባክዎን ወርሃዊ ክፍያ ይክፈሉ።");
        }
      });
    }

    // 4. ምርት ማጥፋት
    function deleteProduct(prodId) {
      if (confirm("እርግጠኛ ነዎት ይህ ምርት ይጥፋ?")) {
        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "delete_product",
            product_id: prodId
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            loadData();
          }
        });
      }
    }
  </script>
</body>
</html>
