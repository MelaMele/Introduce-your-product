<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የ1-ደቂቃ ዲጂታል ሱቅ</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; padding: 15px; color: #333; }
        .card { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { margin-bottom: 12px; color: #1a1a1a; font-size: 18px; }
        label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: bold; color: #555; }
        input, button { width: 100%; padding: 12px; margin: 4px 0 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; outline: none; }
        input:focus { border-color: #0088cc; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { opacity: 0.8; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .share-box { background: #eef7ff; border: 1px dashed #0088cc; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; }
        .share-box p { font-size: 13px; color: #333; word-break: break-all; font-weight: bold; margin-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .product-card { background: #fff; border-radius: 10px; border: 1px solid #eee; overflow: hidden; text-align: center; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: relative; }
        .product-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; background: #f0f0f0; }
        .product-card h4 { font-size: 14px; margin: 8px 0 4px; color: #222; }
        .price { font-weight: bold; color: #28a745; margin-bottom: 8px; font-size: 15px; }
        .buy-btn { background: #0088cc; padding: 8px; font-size: 13px; margin: 4px 0 0; }
        .delete-btn { background: #dc3545; padding: 6px; font-size: 11px; margin-top: 5px; }
        .search-box { margin-bottom: 15px; }
        .hidden { display: none; }
        .status-msg { font-size: 13px; color: #666; text-align: center; margin-top: 5px; }
        footer { text-align: center; padding: 20px 10px; margin-top: 30px; border-top: 1px solid #eee; color: #666; font-size: 13px; }
        footer a { color: #0088cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. የሱቅ መመዝገቢያ/መግቢያ (ለነጋዴው) -->
    <div class="card" id="login-section">
        <h2>📱 በስልክ ቁጥርዎ ይግቡ / ሱቅ ይክፈቱ</h2>
        <label for="sellerPhone">የስልክ ቁጥር</label>
        <input type="tel" id="sellerPhone" placeholder="ምሳሌ፡ 0913064239">
        
        <label for="storeName">የሱቅዎ ስም</label>
        <input type="text" id="storeName" placeholder="ምሳሌ፡ Mela Fashion">

        <label for="telegramUser">የቴሌግራም ዩዘርኔም (ያለ @)</label>
        <input type="text" id="telegramUser" placeholder="ምሳሌ፡ mela_store">
        
        <button onclick="loginOrRegisterStore()">ሱቅ ክፈት / ግባ 🚀</button>
    </div>

    <!-- 2. የነጋዴው ማስገቢያ ፎርም (ለነጋዴው) -->
    <div class="card hidden" id="seller-section">
        <h2 id="welcomeMsg">🛍️ አዲስ ምርት ጨምር</h2>
        
        <label for="prodName">የምርቱ ስም</label>
        <input type="text" id="prodName" placeholder="ምሳሌ፡ የወንዶች ጂንስ">
        
        <label for="prodPrice">ዋጋ (በብር)</label>
        <input type="number" id="prodPrice" placeholder="ምሳሌ፡ 2500">
        
        <label for="prodImageFile">የምርቱ ፎቶ</label>
        <input type="file" id="prodImageFile" accept="image/*" capture="environment">
        
        <button id="saveBtn" onclick="addProduct()">ምርቱን መዝግብ 📸</button>
        <div id="loadingStatus" class="status-msg"></div>

        <!-- የሱቅ ሊንክ ማጋሪያ -->
        <div class="share-box">
            <span style="font-size: 12px; color: #555;">የእርስዎ የሱቅ ሊንክ (ለደንበኞች የሚያጋሩት)፡</span>
            <p id="storeShareUrl">...</p>
            <button onclick="copyStoreLink()" style="background: #17a2b8; margin: 0; padding: 8px; font-size: 12px;">ሊንኩን ኮፒ አድርግ 📋</button>
        </div>
    </div>

    <!-- 3. ለደንበኛው የሚታየው ሱቅ -->
    <div class="card">
        <h3 id="storeTitle">የእኔ ዲጂታል ካታሎግ</h3>
        
        <!-- የምርት ፍለጋ ሳጥን (Search Bar) -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ምርት በስም ፈልግ..." onkeyup="filterProducts()">

        <div class="grid" id="productGrid">
            <p style="grid-column: 1/-1; text-align: center; color: #888;">ምንም የተጫነ ምርት የለም።</p>
        </div>
    </div>

    <!-- የብራንዲንግ እና የእውቂያ መረጃ (Footer) -->
    <footer>
        <p style="margin: 0 0 5px 0;">Powered by <strong>Melak Advertising</strong></p>
        <p style="margin: 0;">ለእርስዎም መሰል የዌብሳይትና የካታሎግ አፕሊኬሽን ለመስራት፦ <a href="tel:+251913064239">+251913064239</a></p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_KuxupH5jnMp9JMTa-rf3nCa6P6UBKQWP_pKRA0vhyO-1DLBrmk55OO294O6nj9s/exec"; 
        let currentPhone = "";
        let telegramUsername = "";
        let allProducts = [];
        let isSeller = false;

        function cleanPhone(p) {
            if(!p) return "";
            let str = String(p).replace(/\D/g, '');
            return str.slice(-9);
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const phoneParam = urlParams.get('phone');
            telegramUsername = urlParams.get('tg') || "";

            if (phoneParam) {
                const cleanedPhone = cleanPhone(phoneParam);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('seller-section').classList.add('hidden');
                document.getElementById('storeTitle').innerText = `🛒 የሱቅ ካታሎግ`;
                loadStoreProducts(cleanedPhone);
            }
        };

        async function loginOrRegisterStore() {
            const rawPhone = document.getElementById('sellerPhone').value.trim();
            const store = document.getElementById('storeName').value.trim();
            telegramUsername = document.getElementById('telegramUser').value.trim().replace('@', '');

            if (!rawPhone) {
                alert('እባክዎን የስልክ ቁጥር ያስገቡ!');
                return;
            }

            isSeller = true;
            currentPhone = cleanPhone(rawPhone);
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('seller-section').classList.remove('hidden');
            document.getElementById('welcomeMsg').innerText = `🛍️ ${store || 'የእኔ ሱቅ'} - አዲስ ምርት ጨምር`;
            document.getElementById('storeTitle').innerText = `🛍️ ${store || 'የእኔ ሱቅ'} - የዕቃዎች ዝርዝር`;

            const shareUrl = `${window.location.origin}${window.location.pathname}?phone=${currentPhone}&tg=${telegramUsername}`;
            document.getElementById('storeShareUrl').innerText = shareUrl;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'register_store', 
                    phone: currentPhone, 
                    store_name: store,
                    telegram_username: telegramUsername
                })
            });

            loadStoreProducts(currentPhone);
        }

        function copyStoreLink() {
            const shareUrl = document.getElementById('storeShareUrl').innerText;
            navigator.clipboard.writeText(shareUrl);
            alert('የሱቅዎ ሊንክ ኮፒ ተደርጓል!');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const fileInput = document.getElementById('prodImageFile');
            const saveBtn = document.getElementById('saveBtn');
            const statusDiv = document.getElementById('loadingStatus');

            if (!name || !price || !fileInput.files[0]) {
                alert('እባክዎን ስም፣ ዋጋ እና ፎቶ ያስገቡ!');
                return;
            }

            saveBtn.innerText = "ፎቶው እየተዘጋጀ ነው... ⏳";
            saveBtn.disabled = true;

            const file = fileInput.files[0];
            compressImage(file, 800, 0.7, async function(base64Image) {
                statusDiv.innerText = "ምርቱ ወደ ሲስተም እየተላከ ነው...";
                
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'add_product',
                            seller_phone: currentPhone,
                            name: name,
                            price: price,
                            image_data: base64Image
                        })
                    });

                    alert('ምርቱ በተሳካ ሁኔታ ተመዝግቧል!');
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodPrice').value = '';
                    document.getElementById('prodImageFile').value = '';
                    statusDiv.innerText = "";
                    
                    setTimeout(() => { loadStoreProducts(currentPhone); }, 2500);
                } catch(err) {
                    alert('ምርቱን ሲጭን ስህተት አጋጥሟል!');
                } finally {
                    saveBtn.innerText = "ምርቱን መዝግብ 📸";
                    saveBtn.disabled = false;
                }
            });
        }

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function loadStoreProducts(phone) {
            try {
                const res = await fetch(`${SCRIPT_URL}?phone=${phone}`);
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                console.error("Error loading products:", err);
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(!products || products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">ምንም የተጫነ ምርት የለም።</p>';
                return;
            }
            products.forEach((p) => {
                let deleteBtnHtml = isSeller ? `<button class="delete-btn" onclick="deleteProduct('${p.id}')">አጥፋ 🗑️</button>` : '';
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image_url}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
                        <h4>${p.name}</h4>
                        <div class="price">${p.price} ብር</div>
                        <button class="buy-btn" onclick="orderByTelegram('${p.name}', '${p.price}', '${p.seller_phone}')">በቴሌግራም እዘዝ ✈️</button>
                        ${deleteBtnHtml}
                    </div>
                `;
            });
        }

        async function deleteProduct(productId) {
            if (!confirm('እርግጠኛ ነዎት ይህንን ምርት ማጥፋት ይፈልጋሉ?')) return;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'delete_product', product_id: productId })
            });

            alert('ምርቱ ጠፍቷል!');
            setTimeout(() => { loadStoreProducts(currentPhone); }, 1500);
        }

        async function orderByTelegram(prodName, price, sellerPhone) {
            const custPhone = prompt("እባክዎን የትዕዛዝ ማረጋገጫ የስልክ ቁጥርዎን ያስገቡ፡");
            if (!custPhone) return;

            // 1. ትዕዛዙን በ Sheet መመዝገብ
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'create_order',
                    seller_phone: sellerPhone,
                    product_name: prodName,
                    price: price,
                    customer_phone: custPhone
                })
            });

            // 2. ወደ ቴሌግራም መምራት
            const message = encodeURIComponent(`ሰላም! '${prodName}' በ ${price} ብር ማዘዝ እፈልጋለሁ።\nየእኔ ስልክ ቁጥር፡ ${custPhone}`);
            let tgLink = telegramUsername ? `https://t.me/${telegramUsername}?text=${message}` : `https://t.me/share/url?url=&text=${message}`;
            
            window.open(tgLink, '_blank');
        }
    </script>
</body>
</html>
